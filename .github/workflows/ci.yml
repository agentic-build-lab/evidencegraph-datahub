name: evidencegraph-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Pin Gitleaks image
        run: docker pull ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      - name: Scan complete Git history
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --config /repo/.gitleaks.toml --redact --no-banner
          --log-opts="--all" /repo
      - name: Build release-tree archive
        run: |
          mkdir -p /tmp/evidencegraph-release
          git archive --format=tar HEAD -o /tmp/evidencegraph-release.tar
          tar -xf /tmp/evidencegraph-release.tar -C /tmp/evidencegraph-release
      - name: Scan release-tree archive
        run: >-
          docker run --rm
          -v "/tmp/evidencegraph-release:/release"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir --config /release/.gitleaks.toml --redact --no-banner /release

  python:
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.11, 3.12]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.1
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-extras --locked --python ${{ matrix.python-version }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src scripts
      - run: uv run --no-sync pytest -q

  public-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
