  <script src="node_modules/gsap/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="01-change-not-incident"]');
    const pick = (name) =>
      root.getElementsByClassName(`f01-change-not-incident-${name}`)[0] ?? null;
    const pickAll = (name) =>
      Array.from(root.getElementsByClassName(`f01-change-not-incident-${name}`));

      const grid = pick("grid");
      const kicker = pick("kicker");
      const words = pickAll("word");
      const fieldCard = pick("field-card");
      const fieldState = pick("field-state");
      const proposal = pick("proposal-frame");
      const incident = pick("incident-wrap");
      const strikePath = pick("strike-path");
      const questionShell = pick("question-shell");
      const questionWords = pickAll("question-word");
      const progress = pick("progress-fill");

      const phraseContent = ["A", "schema", "change"];
      let phraseCursor = 0.12;
      const phraseTiming = phraseContent.map((text, index) => {
        const duration = 0.34 + text.length * 0.035;
        const start = phraseCursor;
        phraseCursor += duration + (index === phraseContent.length - 1 ? 0.24 : 0.08);
        return { text, start, duration };
      });

      const fieldSequence = [
        { t: 0.0, text: "" },
        { t: 0.35, text: "segment_" },
        { t: 0.72, text: "segment_cd" },
        { t: 1.05, text: "segment_c" },
        { t: 1.38, text: "segment_code" },
        { t: 1.78, text: "segment_code  ✓" },
      ];

      const fieldTextAt = (time) => {
        for (let i = fieldSequence.length - 1; i >= 0; i -= 1) {
          if (time >= fieldSequence[i].t) return fieldSequence[i].text;
        }
        return "";
      };

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        grid,
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "42px 20px", duration: 11, ease: "none" },
        0,
      );
      tl.fromTo(kicker, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.05);

      phraseTiming.forEach((entry, index) => {
        tl.fromTo(
          words[index],
          { opacity: 0, x: -48, y: 18, filter: "blur(9px)" },
          {
            opacity: 1,
            x: 0,
            y: 0,
            filter: "blur(0px)",
            duration: entry.duration,
            ease: "power3.out",
          },
          entry.start,
        );
      });

      tl.fromTo(
        proposal,
        { opacity: 0.1, x: 176, y: 18, scale: 0.92, filter: "blur(8px)" },
        { opacity: 0.18, x: 116, y: 10, scale: 0.94, filter: "blur(5px)", duration: 3, ease: "none" },
        0,
      );
      tl.to(
        proposal,
        { opacity: 1, x: 0, y: 0, scale: 1, filter: "blur(0px)", duration: 1.1, ease: "power3.out" },
        3,
      );

      tl.fromTo(
        fieldCard,
        { opacity: 0, x: -54, filter: "blur(8px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.65, ease: "power3.out" },
        3.15,
      );

      const fieldDriver = { t: 0 };
      let lastFieldText = "";
      tl.to(
        fieldDriver,
        {
          t: 2.15,
          duration: 2.15,
          ease: "none",
          onUpdate: () => {
            const nextText = fieldTextAt(fieldDriver.t);
            if (nextText !== lastFieldText) {
              fieldState.textContent = nextText;
              lastFieldText = nextText;
            }
          },
        },
        3.35,
      );

      const strikeLength = strikePath.getTotalLength();
      gsap.set(strikePath, {
        strokeDasharray: strikeLength,
        strokeDashoffset: strikeLength,
      });
      tl.fromTo(
        incident,
        { opacity: 0, scale: 1.16, x: -34, filter: "blur(11px)" },
        { opacity: 1, scale: 1, x: 0, filter: "blur(0px)", duration: 0.72, ease: "power3.out" },
        7,
      );
      tl.to(
        strikePath,
        { strokeDashoffset: 0, duration: 0.8, ease: "power1.inOut" },
        7.68,
      );

      tl.fromTo(
        questionShell,
        { opacity: 0, scale: 0.91, x: 36, filter: "blur(12px)" },
        { opacity: 1, scale: 1, x: 0, filter: "blur(0px)", duration: 0.72, ease: "power3.out" },
        9.05,
      );
      tl.to(proposal, { scale: 0.985, x: 10, duration: 0.72, ease: "power3.out" }, 9.05);

      questionWords.forEach((word, index) => {
        tl.fromTo(
          word,
          { opacity: 0, x: -28, y: 10, filter: "blur(7px)" },
          {
            opacity: 1,
            x: 0,
            y: 0,
            filter: "blur(0px)",
            duration: 0.38,
            ease: "power2.out",
          },
          9.52 + index * 0.31,
        );
      });

      tl.fromTo(progress, { width: "0%" }, { width: "100%", duration: 11, ease: "none" }, 0);

      const hold = { t: 0 };
      tl.to(hold, { t: 1, duration: 3, ease: "none" }, 11);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-change-not-incident"] = tl;
    })();
  </script>
