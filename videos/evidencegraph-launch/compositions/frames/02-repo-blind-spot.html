  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const camera = document.getElementById("f02-repo-blind-spot-camera");
      const counter = document.getElementById("f02-repo-blind-spot-counter");
      const coverage = document.getElementById("f02-repo-blind-spot-coverage");

      accentSegments.forEach((segment) => {
        const length = segment.getTotalLength();

        segment.style.strokeDashoffset = `${length}`;
      });

      const markerLength = marker.getTotalLength();
      marker.style.strokeDasharray = `${markerLength}`;
      marker.style.strokeDashoffset = `${markerLength}`;

      const countState = { value: 0 };
      const coverageState = { value: 0 };
      const phase = { scale: 0.96, x: 0, y: 0 };
      const drift = { p: 0 };

      camera.style.transform = "translate(0px, 0px) scale(0.96)";

      tl.fromTo(
        ".f02-instrument",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" },
        0.05,
      );
      tl.to(
        countState,
        {
          value: 3,
          duration: 2.4,
          ease: "power3.out",
          onUpdate: () => {
            counter.textContent = Math.round(countState.value).toLocaleString();
          },
        },
        0.3,
      );
      tl.fromTo(
        counter,
        { scale: 0.58 },
        { scale: 1, duration: 2.4, ease: "power3.out" },
        0.3,
      );
      tl.to(
        accentSegments,
        { strokeDashoffset: 0, duration: 2.16, ease: "power3.out", stagger: 0.12 },
        0.3,
      );
      tl.fromTo(
        ".f02-counter-label",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        0.65,
      );

      tl.to(
        ".f02-instrument",
        { x: -430, scale: 0.82, duration: 1.15, ease: "power2.inOut" },
        4.0,
      );
      tl.fromTo(
        ".f02-known-card",
        { opacity: 0, x: 95 },
        { opacity: 1, x: 0, duration: 0.72, ease: "power3.out", stagger: 0.18 },
        4.35,
      );
      tl.fromTo(
        ".f02-section-label",
        { opacity: 0, x: 34 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power2.out" },
        4.2,
      );

      tl.to(phase, { scale: 1.14, x: -80, y: -8, duration: 2.15, ease: "power2.inOut" }, 9.0);
      tl.to(
        ".f02-instrument",
        { "--dof": "8px", opacity: 0.3, duration: 1.0, ease: "power2.inOut" },
        9.0,
      );
      tl.to(
        ".f02-known",
        { "--dof": "11px", opacity: 0.22, duration: 1.0, ease: "power2.inOut" },
        9.0,
      );
      tl.to(
        ".f02-support-shot",
        { "--dof": "9px", opacity: 0.08, duration: 1.0, ease: "power2.inOut" },
        9.0,
      );
      tl.fromTo(
        ".f02-missing-label",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.65, ease: "power2.out" },
        9.15,
      );

      gsap.utils.toArray(".f02-ghost-card").forEach((card, index) => {
        const depth = Number(card.dataset.depth) || 1;
        tl.fromTo(
          card,
          { "--dof": `${5 + depth * 2.5}px`, opacity: 0, y: 34, scale: 0.92 },
          {
            "--dof": "0px",
            opacity: 1,
            y: 0,
            scale: 1,
            duration: 0.82,
            ease: "power2.out",
          },
          9.45 + index * 1.18,
        );
      });

      tl.to(phase, { scale: 1.04, x: 0, y: 0, duration: 1.15, ease: "power2.inOut" }, 15.0);
      tl.to(
        ".f02-ghost-card",
        { "--dof": "8px", opacity: 0.2, duration: 0.9, ease: "power2.inOut" },
        15.0,
      );
      tl.to(
        ".f02-missing-label",
        { "--dof": "7px", opacity: 0.2, duration: 0.9, ease: "power2.inOut" },
        15.0,
      );
      tl.fromTo(
        ".f02-verdict",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.85, ease: "power2.out" },
        15.1,
      );
      tl.to(
        coverageState,
        {
          value: 42.9,
          duration: 1.4,
          ease: "power3.out",
          onUpdate: () => {
            coverage.textContent = `${coverageState.value.toFixed(1)}%`;
          },
        },
        15.2,
      );
      tl.fromTo(
        coverage,
        { scale: 0.7 },
        { scale: 1, duration: 1.4, ease: "power3.out" },
        15.2,
      );
      tl.fromTo(
        ".f02-false-safe",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.72, ease: "power2.out" },
        16.35,
      );
      tl.to(marker, { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" }, 17.15);

      tl.to(
        drift,
        {
          p: Math.PI * 3,
          duration: 20,
          ease: "none",
          onUpdate: () => {
            const dx = Math.sin(drift.p) * 3;
            const dy = Math.sin(drift.p * 1.31) * 2;
            camera.style.transform = `translate(${phase.x + dx}px, ${phase.y + dy}px) scale(${phase.scale})`;
          },
        },
        0,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["02-repo-blind-spot"] = tl;
    })();
