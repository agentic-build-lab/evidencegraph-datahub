      const tl = gsap.timeline({ paused: true });
      const plate = root.querySelector('.frame-f03-context-graph-plate');
      const veil = root.querySelector('.frame-f03-context-graph-veil');
      const core = root.querySelector('[id="f03-context-graph-core"]');
      const orbit = root.querySelector('.frame-f03-context-graph-core-orbit');
      const badges = Array.from(root.querySelectorAll('.frame-f03-context-graph-badge'));
      const badgeLines = Array.from(root.querySelectorAll('.frame-f03-context-graph-badge-line'));
      const nodes = Array.from(root.querySelectorAll('.frame-f03-context-graph-node'));
      const nodeLines = Array.from(root.querySelectorAll('.frame-f03-context-graph-node-line'));
      const inwardLines = Array.from(root.querySelectorAll('.frame-f03-context-graph-inward-line'));
      const cameraOuter = root.querySelector('.frame-f03-context-graph-camera-outer');
      const cameraInner = root.querySelector('.frame-f03-context-graph-camera-inner');
      const finalLabel = root.querySelector('.frame-f03-context-graph-final-label');

      [...badgeLines, ...nodeLines, ...inwardLines].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });

      tl.fromTo(plate, { opacity: 0.12, scale: 1.025 }, { opacity: 0.6, scale: 1, duration: 1.4, ease: 'power2.out' }, 0);

      tl.fromTo(orbit, { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 1.2, ease: 'power2.out' }, 0.35);

      badges.forEach((badge, index) => {
        const at = 3.55 + index * 0.8;
        tl.fromTo(badge, { opacity: 0, scale: 0, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.58, ease: 'power3.out' }, at);
        tl.to(badgeLines[index], { strokeDashoffset: 0, duration: 0.65, ease: 'power2.out' }, at + 0.42);
      });

      nodes.forEach((node, index) => {
        const at = 7 + index * 0.82;
        tl.fromTo(node, { opacity: 0, scale: 0, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.56, ease: 'power3.out' }, at);
        tl.to(nodeLines[index], { strokeDashoffset: 0, duration: 0.58, ease: 'power2.out' }, at + 0.38);
      });

      inwardLines.forEach((line, index) => {
        tl.to(line, { strokeDashoffset: 0, duration: 0.72, ease: 'power2.out' }, 14.5 + index * 0.13);
      });
      [...badges, ...nodes].forEach((element) => {
        const depth = Number(element.dataset.depth) || 1;
        tl.to(element, { '--dof': `${1.35 * depth}px`, opacity: 0.5, duration: 1.35, ease: 'power2.inOut' }, 14.65);
      });
      tl.to(cameraOuter, { scale: 1.12, duration: 1.45, ease: 'power3.inOut' }, 14.65);
      tl.to(cameraInner, { x: 0, y: 0, duration: 1.45, ease: 'power3.inOut' }, 14.65);
      tl.to(nodeLines, { opacity: 0.2, duration: 1.1, ease: 'power2.inOut' }, 14.65);
      tl.fromTo(finalLabel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.65, ease: 'power2.out' }, 16.05);
