  <script src="node_modules/gsap/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="04-complete-blast-radius"]');
    const pick = (name) =>
      root.getElementsByClassName(`f04-complete-blast-radius-${name}`)[0] ?? null;
    const pickAll = (name) =>
      Array.from(root.getElementsByClassName(`f04-complete-blast-radius-${name}`));

      const header = pick("header");
      const counter = pick("known-counter");
      const baselineStage = pick("baseline-stage");
      const knownCards = pickAll("known-card");
      const hiddenCards = pickAll("hidden-card");
      const metaFields = pickAll("meta");
      const evidenceMarks = pickAll("evidence-mark");
      const groundedLine = pick("grounded-line");
      const sweep = pick("evidence-sweep");
      const progress = pick("progress-fill");

      const rowFacts = [
        { owner: "analytics-engineering", severity: "CRITICAL", urn: "urn:li:dataset" },
        { owner: "growth-analytics", severity: "BLOCKER", urn: "urn:li:dataset" },
        { owner: "data-platform", severity: "HIGH", urn: "urn:li:dataJob" },
        { owner: "finance-analytics", severity: "CRITICAL", urn: "urn:li:dashboard" },
        { owner: "risk-ml", severity: "BLOCKER", urn: "urn:li:mlFeature" },
        { owner: "risk-ml", severity: "CRITICAL", urn: "urn:li:mlModel" },
        { owner: "ml-platform", severity: "BLOCKER", urn: "urn:li:mlDeployment" },
      ];

      const sequences = rowFacts.map((fact) => [
        { t: 0, text: "" },
        { t: 0.16, text: `owner · ${fact.owner}` },
        { t: 0.42, text: `owner · ${fact.owner}\nseverity · ${fact.severity}` },
        {
          t: 0.72,
          text: `owner · ${fact.owner}\nseverity · ${fact.severity}\nevidence · ${fact.urn}`,
        },
      ]);

      const textAt = (sequence, time) => {
        for (let i = sequence.length - 1; i >= 0; i -= 1) {
          if (time >= sequence[i].t) return sequence[i].text;
        }
        return "";
      };

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(header, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.05);
      tl.fromTo(
        counter,
        { opacity: 0, x: -34, filter: "blur(7px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
        0.12,
      );
      tl.fromTo(
        baselineStage,
        { opacity: 0.28, x: -18 },
        { opacity: 1, x: 0, duration: 0.75, ease: "power2.out" },
        0,
      );

      knownCards.forEach((card, index) => {
        tl.fromTo(
          card,
          { opacity: 0, x: -40, y: 10, filter: "blur(7px)" },
          { opacity: 1, x: 0, y: 0, filter: "blur(0px)", duration: 0.56, ease: "power3.out" },
          0.45 + index * 0.62,
        );
      });

      const hiddenEntryTimes = [4.18, 5.78, 7.48, 9.18];
      hiddenCards.forEach((card, index) => {
        const entryX = Number(card.dataset.entryX);
        const entryY = Number(card.dataset.entryY);
        tl.fromTo(
          card,
          { opacity: 0, x: entryX, y: entryY, scale: 0.82, filter: "blur(9px)" },
          {
            opacity: 1,
            x: 0,
            y: 0,
            scale: 1,
            filter: "blur(0px)",
            duration: 1.02,
            ease: "power3.out",
          },
          hiddenEntryTimes[index],
        );
      });

      metaFields.forEach((field, index) => {
        const driver = { t: 0 };
        let lastText = "";
        const start = 11 + index * 0.68;
        tl.to(
          driver,
          {
            t: 0.9,
            duration: 0.9,
            ease: "none",
            onUpdate: () => {
              const next = textAt(sequences[index], driver.t);
              if (next !== lastText) {
                field.textContent = next;
                lastText = next;
              }
            },
          },
          start,
        );
        tl.fromTo(
          evidenceMarks[index],
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.44, ease: "power2.out" },
          start + 0.72,
        );
      });

      tl.fromTo(
        groundedLine,
        { opacity: 0, y: -18, scale: 0.96, filter: "blur(8px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.82, ease: "power3.out" },
        16.5,
      );

      tl.fromTo(
        sweep,
        { x: -150, opacity: 0 },
        { x: 340, opacity: 0.3, duration: 1.35, ease: "none" },
        17.35,
      );
      tl.to(sweep, { opacity: 0, duration: 0.3, ease: "power1.in" }, 18.45);

      tl.fromTo(progress, { width: "0%" }, { width: "100%", duration: 18.75, ease: "none" }, 0);

      const hold = { t: 0 };
      tl.to(hold, { t: 1, duration: 2.25, ease: "none" }, 18.75);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-complete-blast-radius"] = tl;
    })();
  </script>
