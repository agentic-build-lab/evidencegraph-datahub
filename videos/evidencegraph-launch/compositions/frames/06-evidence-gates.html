      .frame-f06-evidence-gates-stack-card,
      .frame-f06-evidence-gates-completeness-card,
      .frame-f06-evidence-gates-mutation-card {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(64, 224, 192, 0.18);
        border-radius: 12px;
        background: rgba(64, 224, 192, 0.04);
      }
      .frame-f06-evidence-gates-stack-label,
      .frame-f06-evidence-gates-completeness-label,
      .frame-f06-evidence-gates-mutation-label { padding: 1.1cqw; color: #656565; font-size: 0.72cqw; font-weight: 600; letter-spacing: 0.08em; }
      .frame-f06-evidence-gates-page {
        position: absolute;
        left: 3.2cqw;
        width: 15.5cqw;
        height: 9.4cqh;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.1cqw;
        border: 1px solid rgba(64, 224, 192, 0.2);
        border-radius: 10px;
        color: #e7eeeb;
        background: #10272f;
        font-size: 0.95cqw;
        font-weight: 600;
        transform-origin: 50% 50%;
      }
      .frame-f06-evidence-gates-page b { display: flex; align-items: center; justify-content: center; width: 1.2cqw; height: 1.2cqw; border-radius: 50%; color: #0c1b22; background: #40e0c0; font-size: 0.72cqw; }
      .frame-f06-evidence-gates-page-one { top: 26.5cqh; opacity: 0.46; }
      .frame-f06-evidence-gates-page-two { top: 22cqh; opacity: 0.62; }
      .frame-f06-evidence-gates-page-three { top: 17.5cqh; opacity: 0.8; }
      .frame-f06-evidence-gates-page-four { top: 13cqh; border-color: rgba(64, 224, 192, 0.44); }
      .frame-f06-evidence-gates-terminal { display: flex; align-items: baseline; gap: 0.65cqw; margin: 7.2cqh 1.5cqw 0; color: #e7eeeb; font-size: 1.65cqw; font-weight: 600; }
      .frame-f06-evidence-gates-terminal-prompt { color: #40e0c0; }
      .frame-f06-evidence-gates-terminal-wrap { display: inline-flex; align-items: baseline; min-width: 20cqw; white-space: nowrap; }
      .frame-f06-evidence-gates-completeness-cursor { display: inline-block; width: 0.8cqw; color: #ff7048; }
      .frame-f06-evidence-gates-risk { margin: 4.3cqh 1.5cqw 0; padding: 1.2cqh 0.9cqw; border-left: 4px solid #ff7048; border-radius: 12px; color: #ff7048; background: rgba(255, 112, 72, 0.08); font-size: 0.76cqw; font-weight: 600; letter-spacing: 0.05em; }
      .frame-f06-evidence-gates-mutation-nodes { display: flex; align-items: center; justify-content: space-between; margin: 6.4cqh 1.35cqw 0; color: #e7eeeb; font-size: 0.74cqw; font-weight: 600; letter-spacing: 0.06em; }
      .frame-f06-evidence-gates-mutation-nodes i { display: block; width: 3.5cqw; height: 1px; background: rgba(64, 224, 192, 0.24); }
      .frame-f06-evidence-gates-lane { position: relative; height: 2.6cqh; margin: 3.6cqh 1.35cqw 0; overflow: visible; border-radius: 6px; background: rgba(64, 224, 192, 0.08); }
      .frame-f06-evidence-gates-lane-fill { width: 100%; height: 100%; border-radius: 6px; background: #ff7048; transform-origin: 0% 50%; }
      .frame-f06-evidence-gates-lane-lock { position: absolute; right: -0.65cqw; top: -1.1cqh; display: flex; align-items: center; justify-content: center; width: 2.4cqw; height: 2.4cqw; border-radius: 50%; color: #0c1b22; background: #ff7048; font-size: 1.4cqw; font-weight: 700; }
      .frame-f06-evidence-gates-lane-state { margin: 3.4cqh 1.35cqw 0; color: #ff7048; font-size: 1.45cqw; font-weight: 700; letter-spacing: 0.06em; text-align: right; }
    </style>

    <script>
      (() => {
        const root = document.querySelector('[data-composition-id="06-evidence-gates"]');
        if (!root) return;

        const tl = gsap.timeline({ paused: true });
        const title = root.querySelector('[id="f06-evidence-gates-title"]');
        const titleCursor = root.querySelector('[id="f06-evidence-gates-title-cursor"]');
        const scanState = root.querySelector('[id="f06-evidence-gates-scan-state"]');
        const spinner = root.querySelector('[id="f06-evidence-gates-spinner"]');
        const progress = root.querySelector('[id="f06-evidence-gates-progress"]');
        const runtimePlate = root.querySelector('.frame-f06-evidence-gates-runtime-plate');
        const proofWindow = root.querySelector('.frame-f06-evidence-gates-proof-window');
        const validators = Array.from(root.querySelectorAll('.frame-f06-evidence-gates-validator'));
        const rowSpinners = Array.from(root.querySelectorAll('.frame-f06-evidence-gates-row-spinner'));
        const receipt = root.querySelector('[id="f06-evidence-gates-receipt"]');
        const receiptPaths = Array.from(root.querySelectorAll('.frame-f06-evidence-gates-check-paths path'));
        const receiptChips = Array.from(root.querySelectorAll('.frame-f06-evidence-gates-receipt-chips span'));
        const safetyPhase = root.querySelector('[id="f06-evidence-gates-safety-phase"]');
        const lineagePage = root.querySelector('[id="f06-evidence-gates-lineage-page"]');
        const completenessText = root.querySelector('[id="f06-evidence-gates-completeness-text"]');
        const completenessCursor = root.querySelector('[id="f06-evidence-gates-completeness-cursor"]');
        const risk = root.querySelector('[id="f06-evidence-gates-risk"]');
        const laneFill = root.querySelector('[id="f06-evidence-gates-lane-fill"]');
        const laneLock = root.querySelector('[id="f06-evidence-gates-lane-lock"]');
        const laneState = root.querySelector('[id="f06-evidence-gates-lane-state"]');
        const mergeVerdict = root.querySelector('[id="f06-evidence-gates-merge"]');
        const refuseVerdict = root.querySelector('[id="f06-evidence-gates-refuse"]');
        const zeroMutations = root.querySelector('[id="f06-evidence-gates-zero"]');

        const titleText = '14 deterministic gates';
        const titleDriver = { value: 0 };
        const titleBlink = { phase: 0 };

        tl.fromTo(root.querySelector('.frame-f06-evidence-gates-eyebrow'), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.42, ease: 'power3.out' }, 0);
        tl.fromTo(root.querySelector('.frame-f06-evidence-gates-scan-lockup'), { opacity: 0, scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power3.out' }, 0.05);
        tl.to(titleDriver, { value: titleText.length, duration: 2.2, ease: 'power1.inOut', onUpdate: () => { title.textContent = titleText.substring(0, Math.floor(titleDriver.value)); } }, 0.18);
        tl.to(titleBlink, { phase: Math.PI * 20, duration: 4, ease: 'none', onUpdate: () => { titleCursor.style.opacity = Math.sin(titleBlink.phase) > 0 ? '1' : '0'; } }, 0);
        tl.fromTo(runtimePlate, { opacity: 0, y: 18, scale: 0.985 }, { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: 'power3.out' }, 0.55);
        tl.fromTo(proofWindow, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.7, ease: 'power3.out' }, 1.2);
        tl.to(spinner, { rotation: 1440, transformOrigin: '50% 50%', duration: 12.4, ease: 'none' }, 0.1);

        rowSpinners.forEach((element, index) => {
          tl.to(element, { rotation: 1080, transformOrigin: '50% 50%', duration: 7.4 - index * 0.55, ease: 'none' }, 4 + index * 0.62);
        });

        const resolveTimes = [5.35, 6.85, 8.45, 10.2, 12.15];
        validators.forEach((row, index) => {
          const running = row.querySelector('.frame-f06-evidence-gates-running');
          const passed = row.querySelector('.frame-f06-evidence-gates-passed');
          const appearAt = 4 + index * 0.65;
          const resolveAt = resolveTimes[index];

          tl.set(passed, { opacity: 0, scale: 0.74 }, 0);
          tl.fromTo(row, { opacity: 0, scale: 0, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: 'power3.out' }, appearAt);
          tl.to(running, { scale: 0.74, opacity: 0, duration: 0.34, ease: 'power2.in' }, resolveAt);
          tl.to(passed, { scale: 1, opacity: 1, duration: 0.56, ease: 'back.out(1.4)' }, resolveAt + 0.2);
          tl.call(() => { progress.textContent = `${index + 1} / 5 groups`; }, [], resolveAt + 0.44);
        });
        tl.call(() => { scanState.textContent = 'COMPLETE'; }, [], 12.45);
        tl.to(root.querySelector('.frame-f06-evidence-gates-scan-arc'), { stroke: '#40e0c0', duration: 0.2, ease: 'none' }, 12.45);

        receiptPaths.forEach((path) => {
          const length = path.getTotalLength();
          path.style.strokeDasharray = String(length);
          path.style.strokeDashoffset = String(length);
        });
        tl.set(refuseVerdict, { opacity: 0, scale: 0.72 }, 0);
        tl.fromTo(receipt, { opacity: 0, scale: 0.82, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 13);
        tl.fromTo(root.querySelector('.frame-f06-evidence-gates-count-wrap'), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.62, ease: 'power3.out' }, 13.2);
        receiptPaths.forEach((path, index) => {
          tl.to(path, { strokeDashoffset: 0, duration: 1.3, ease: 'power2.inOut' }, 13.55 + index * 0.32);
        });
        receiptChips.forEach((chip, index) => {
          tl.fromTo(chip, { opacity: 0, scale: 0, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.48, ease: 'power3.out' }, 14.05 + index * 0.09);
        });
        tl.fromTo(mergeVerdict, { opacity: 0, scale: 0.84 }, { opacity: 1, scale: 1, duration: 0.55, ease: 'power3.out' }, 15.2);

        const graphStates = [
          { t: 0, text: 'COMPLETE GRAPH' },
          { t: 0.55, text: 'CHECKING LINEAGE…' },
          { t: 1.25, text: 'CHECKING LINEAG_' },
          { t: 1.65, text: 'CHECKING' },
          { t: 2.05, text: 'UNRESOLVED' }
        ];
        const graphDriver = { time: 0 };
        const graphBlink = { phase: 0 };
        const textAt = (time) => {
          for (let index = graphStates.length - 1; index >= 0; index -= 1) {
            if (time >= graphStates[index].t) return graphStates[index].text;
          }
          return '';
        };

        tl.fromTo(safetyPhase, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.62, ease: 'power3.out' }, 16.5);
        tl.to(receipt, { x: 480, y: -235, scale: 0.58, duration: 0.85, ease: 'power3.inOut' }, 16.5);
        tl.fromTo(root.querySelector('.frame-f06-evidence-gates-stack-card'), { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.52, ease: 'power3.out' }, 16.55);
        tl.fromTo(root.querySelector('.frame-f06-evidence-gates-completeness-card'), { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.52, ease: 'power3.out' }, 16.72);
        tl.fromTo(root.querySelector('.frame-f06-evidence-gates-mutation-card'), { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.52, ease: 'power3.out' }, 16.89);
        tl.to(lineagePage, { opacity: 0, scale: 0.72, y: -70, duration: 0.58, ease: 'power2.in' }, 17.05);
        tl.to(graphDriver, { time: 3.25, duration: 3.25, ease: 'none', onUpdate: () => { completenessText.textContent = textAt(graphDriver.time); completenessText.style.color = graphDriver.time >= 2.05 ? '#ff7048' : '#e7eeeb'; } }, 16.5);
        tl.to(graphBlink, { phase: Math.PI * 10, duration: 3.5, ease: 'none', onUpdate: () => { completenessCursor.style.opacity = Math.sin(graphBlink.phase) > 0 ? '1' : '0'; } }, 16.5);
        tl.fromTo(risk, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.46, ease: 'power3.out' }, 18.6);
        tl.fromTo(laneFill, { scaleX: 0, opacity: 0.28 }, { scaleX: 1, opacity: 1, duration: 2.7, ease: 'power2.inOut' }, 16.8);
        tl.fromTo(laneLock, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power3.out' }, 19.25);
        tl.call(() => { laneState.textContent = 'BLOCKED'; }, [], 19.3);
        tl.to(completenessCursor, { opacity: 0, duration: 0.12, ease: 'none' }, 19.85);

        tl.to(receipt, { x: 0, y: 0, scale: 1, duration: 0.62, ease: 'power3.inOut' }, 20);
        tl.to(mergeVerdict, { scale: 0.72, opacity: 0, duration: 0.34, ease: 'power2.in' }, 20);
        tl.to(refuseVerdict, { scale: 1, opacity: 1, duration: 0.58, ease: 'back.out(1.4)' }, 20.2);
        tl.fromTo(zeroMutations, { opacity: 0, y: 9 }, { opacity: 1, y: 0, duration: 0.42, ease: 'power3.out' }, 20.72);

        window.__timelines = window.__timelines || {};
        window.__timelines['06-evidence-gates'] = tl;
      })();
    </script>
  </div>
</template>
