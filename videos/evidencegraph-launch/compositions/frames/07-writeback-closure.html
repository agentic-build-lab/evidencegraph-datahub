    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <script>
      (() => {
        const scope = document.querySelector('[data-composition-id="07-writeback-closure"]');
        const q = (selector) => scope.querySelector(selector);
        const qa = (selector) => Array.from(scope.querySelectorAll(selector));
        const camera = q('#f07-writeback-closure-camera');
        const rail = q('#f07-writeback-closure-active-rail');
        const approved = q('#f07-writeback-closure-card-approved');
        const retry = q('#f07-writeback-closure-card-retry');
        const replay = q('#f07-writeback-closure-card-replay');
        const finalCard = q('#f07-writeback-closure-final');
        const writeRows = [1, 2, 3].map((index) => q(`#f07-writeback-closure-write-${index}`));
        const retryRows = [1, 2, 3].map((index) => q(`#f07-writeback-closure-retry-${index}`));
        const consumerCount = q('#f07-writeback-closure-consumer-count');
        const consumerDots = qa('#f07-writeback-closure-consumer-dots i');

        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines['07-writeback-closure'] = tl;

        tl.set([approved, retry, replay], { opacity: 0.46 }, 0);
        tl.set(retryRows.map((row) => row.querySelector('.f07-writeback-closure-status-verified')), { opacity: 0 }, 0);
        tl.set(writeRows.map((row) => row.querySelector('.f07-writeback-closure-status-verified')), { opacity: 0 }, 0);

        tl.fromTo(q('#f07-writeback-closure-header'),
          { opacity: 0, y: -18 },
          { opacity: 1, y: 0, duration: 0.52, ease: 'power3.out' },
          0
        );
        tl.fromTo(q('#f07-writeback-closure-provenance'),
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.65, ease: 'power3.out' },
          0.12
        );
        tl.fromTo(camera,
          { opacity: 0, y: 28, scale: 0.98 },
          { opacity: 1, y: 0, scale: 1, duration: 0.82, ease: 'power3.out' },
          0.22
        );
        tl.fromTo([approved, retry, replay],
          { y: 20 },
          { y: 0, duration: 0.72, stagger: 0.12, ease: 'power3.out' },
          0.3
        );

        tl.to(camera, { x: 72, scale: 1.035, duration: 0.72, ease: 'power3.inOut' }, 0.72);
        tl.to(approved, { opacity: 1, borderColor: 'rgba(64, 224, 192, 0.52)', duration: 0.5, ease: 'power2.out' }, 0.76);
        tl.to([retry, replay], { opacity: 0.36, duration: 0.46, ease: 'power2.out' }, 0.76);
        tl.fromTo(q('#f07-writeback-closure-approved-meta'),
          { opacity: 0.28, y: 8 },
          { opacity: 1, y: 0, duration: 0.58, ease: 'power3.out' },
          0.92
        );

        writeRows.forEach((row, index) => {
          const at = 1.2 + index * 1.2;
          const pending = row.querySelector('.f07-writeback-closure-status-pending');
          const verified = row.querySelector('.f07-writeback-closure-status-verified');
          const icon = row.querySelector('.f07-writeback-closure-receipt-icon');
          tl.to(pending, { opacity: 0, duration: 0.18, ease: 'power2.out' }, at);
          tl.fromTo(verified,
            { opacity: 0, y: 6 },
            { opacity: 1, y: 0, duration: 0.38, ease: 'power3.out' },
            at + 0.08
          );
          tl.to(icon, {
            color: '#0c1b22',
            backgroundColor: '#40e0c0',
            borderColor: '#40e0c0',
            duration: 0.34,
            ease: 'power2.out'
          }, at + 0.08);
          tl.to(row, { backgroundColor: 'rgba(64, 224, 192, 0.035)', duration: 0.34, ease: 'power2.out' }, at + 0.08);
        });
        tl.set(q('#f07-writeback-closure-write-counter'), { textContent: '1 / 3' }, 1.42);
        tl.set(q('#f07-writeback-closure-write-counter'), { textContent: '2 / 3' }, 2.62);
        tl.set(q('#f07-writeback-closure-write-counter'), { textContent: '3 / 3' }, 3.82);
        tl.set(q('#f07-writeback-closure-readback-state'), { textContent: '3 VERIFIED' }, 4.28);

        tl.to(camera, { x: 0, scale: 1.025, duration: 0.78, ease: 'power3.inOut' }, 6.12);
        tl.to(rail, { x: 590, duration: 0.72, ease: 'power3.inOut' }, 6.16);
        tl.to(retry, { opacity: 1, borderColor: 'rgba(64, 224, 192, 0.52)', duration: 0.5, ease: 'power2.out' }, 6.18);
        tl.to([approved, replay], { opacity: 0.34, borderColor: 'rgba(121, 184, 171, 0.22)', duration: 0.46, ease: 'power2.out' }, 6.18);
        tl.fromTo(q('#f07-writeback-closure-duplicate-proof'),
          { opacity: 0.25, scale: 0.9 },
          { opacity: 1, scale: 1, duration: 0.65, ease: 'power3.out' },
          6.46
        );

        retryRows.forEach((row, index) => {
          const at = [6.82, 8.72, 9.38][index];
          const pending = row.querySelector('.f07-writeback-closure-status-pending');
          const verified = row.querySelector('.f07-writeback-closure-status-verified');
          const icon = row.querySelector('.f07-writeback-closure-receipt-icon');
          tl.to(pending, { opacity: 0, duration: 0.16, ease: 'power2.out' }, at);
          tl.fromTo(verified,
            { opacity: 0, y: 6 },
            { opacity: 1, y: 0, duration: 0.34, ease: 'power3.out' },
            at + 0.06
          );
          tl.to(icon, {
            color: '#0c1b22',
            backgroundColor: '#40e0c0',
            borderColor: '#40e0c0',
            duration: 0.3,
            ease: 'power2.out'
          }, at + 0.06);
        });

        tl.to(camera, { x: -72, scale: 1.035, duration: 0.82, ease: 'power3.inOut' }, 11.08);
        tl.to(rail, { x: 1180, duration: 0.78, ease: 'power3.inOut' }, 11.12);
        tl.to(replay, { opacity: 1, borderColor: 'rgba(64, 224, 192, 0.52)', duration: 0.52, ease: 'power2.out' }, 11.14);
        tl.to([approved, retry], { opacity: 0.3, borderColor: 'rgba(121, 184, 171, 0.22)', duration: 0.46, ease: 'power2.out' }, 11.14);
        tl.fromTo(q('#f07-writeback-closure-newer-graph'),
          { opacity: 0.28, y: 10 },
          { opacity: 1, y: 0, duration: 0.62, ease: 'power3.out' },
          11.9
        );

        const consumerDriver = { value: 7 };
        tl.to(consumerDriver, {
          value: 0,
          duration: 2.0,
          ease: 'power2.inOut',
          onUpdate: () => {
            consumerCount.textContent = String(Math.max(0, Math.ceil(consumerDriver.value)));
          }
        }, 16.28);
        tl.to(consumerDots, {
          opacity: 0,
          scale: 0.2,
          duration: 0.35,
          stagger: 0.26,
          ease: 'power3.in'
        }, 16.36);
        tl.to(q('.f07-writeback-closure-consumer-proof'), {
          borderColor: 'rgba(64, 224, 192, 0.4)',
          backgroundColor: 'rgba(64, 224, 192, 0.07)',
          duration: 0.58,
          ease: 'power2.out'
        }, 18.34);
        tl.to(consumerCount, { color: '#40e0c0', duration: 0.4, ease: 'power2.out' }, 18.34);
        tl.set(q('#f07-writeback-closure-replay-badge'), { textContent: 'ELIGIBLE' }, 18.42);

        tl.to(camera, { opacity: 0.16, scale: 0.95, duration: 0.72, ease: 'power3.out' }, 18.74);
        tl.fromTo(finalCard,
          { opacity: 0, y: 28, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.78, ease: 'power3.out' },
          18.82
        );
        tl.fromTo(q('.f07-writeback-closure-final-mark span'),
          { opacity: 0, scale: 0.72 },
          { opacity: 1, scale: 1, duration: 0.48, ease: 'power3.out' },
          19.06
        );
        tl.fromTo(q('.f07-writeback-closure-final-mark strong'),
          { opacity: 0, x: -18 },
          { opacity: 1, x: 0, duration: 0.58, ease: 'power3.out' },
          19.18
        );
        tl.fromTo(qa('.f07-writeback-closure-final-facts div'),
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.48, stagger: 0.24, ease: 'power3.out' },
          19.82
        );
      })();
    </script>
