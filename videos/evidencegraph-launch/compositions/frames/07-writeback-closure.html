        const zeroState = scope.querySelector('[id="f07-writeback-closure-zero"]');

        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines['07-writeback-closure'] = tl;

        const cam = { scale: 1, x: 0, y: 0 };
        const applyCamera = () => {
          world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
        };
        applyCamera();

        const WRITE_CONTENT = [
          { key: 'tag', row: 0, tool: 'add_tags', status: 'applied_verified', body: 'tag receipt verified', hold: 0.62 },
          { key: 'description', row: 1, tool: 'update_description', status: 'applied_verified', body: 'description receipt verified', hold: 0.64 },
          { key: 'document', row: 2, tool: 'save_document', status: 'applied_verified', body: 'document receipt verified', hold: 0.82 }
        ];
        const RETRY_CONTENT = [
          { key: 'tag', row: 0, status: 'skipped_idempotent_verified', body: 'tag already verified', hold: 0.36 },
          { key: 'description', row: 1, status: 'skipped_idempotent_verified', body: 'description already verified', hold: 0.38 },
          { key: 'document', row: 2, status: 'skipped_idempotent_verified', body: 'document already verified', hold: 0.5 }
        ];

        const buildSequence = (entries, baseDuration, secondsPerCharacter) => {
          let cumulative = 0;
          return entries.map((entry) => {
            const duration = baseDuration + entry.body.length * secondsPerCharacter + entry.hold;
            const start = cumulative;
            cumulative += duration;
            return { ...entry, start, end: cumulative };
          });
        };

        const WRITE_TIMELINE = buildSequence(WRITE_CONTENT, 0.34, 0.011);
        const RETRY_TIMELINE = buildSequence(RETRY_CONTENT, 0.28, 0.008);
        const writeTotal = WRITE_TIMELINE[WRITE_TIMELINE.length - 1].end;
        const retryTotal = RETRY_TIMELINE[RETRY_TIMELINE.length - 1].end;

        const entryAt = (sequence, time) => {
          for (let index = sequence.length - 1; index >= 0; index -= 1) {
            if (time >= sequence[index].start) return sequence[index];
          }
          return sequence[0];
        };

        let lastWriteKey = '';
        const writeDriver = { t: 0 };
        const updateWriteSequence = () => {
          const entry = entryAt(WRITE_TIMELINE, writeDriver.t);
          if (entry.key !== lastWriteKey) {
            WRITE_TIMELINE.forEach((item, index) => {
      const row = scope.ownerDocument.getElementById(`f07-writeback-closure-write-row-${index}`);
              const status = row.querySelector('[class~="f07-writeback-closure-receipt-status"]');
              const resolved = item.start <= entry.start;
              row.classList.toggle('f07-writeback-closure-resolved', resolved);
              status.textContent = resolved ? item.status : 'pending';
              row.querySelector('[class~="f07-writeback-closure-receipt-icon"]').textContent = resolved ? '✓' : `0${index + 1}`;
            });
            writeCount.textContent = `${entry.row + 1} / 3`;
            writeSequence.textContent = `${entry.tool} · readback verified`;
            lastWriteKey = entry.key;
          }
          writeProgress.style.width = `${Math.min(100, (writeDriver.t / writeTotal) * 100)}%`;
        };

        let lastRetryKey = '';
        const retryDriver = { t: 0 };
        const updateRetrySequence = () => {
          const entry = entryAt(RETRY_TIMELINE, retryDriver.t);
          if (entry.key !== lastRetryKey) {
            RETRY_TIMELINE.forEach((item, index) => {
      const row = scope.ownerDocument.getElementById(`f07-writeback-closure-retry-row-${index}`);
              const status = row.querySelector('b');
              const resolved = item.start <= entry.start;
              row.classList.toggle('f07-writeback-closure-resolved', resolved);
              status.textContent = resolved ? item.status : 'queued';
            });
            lastRetryKey = entry.key;
          }
          retryProgress.style.width = `${Math.min(100, (retryDriver.t / retryTotal) * 100)}%`;
        };

        const CHIP_STATES = [
          { key: 'approval', start: 0, label: 'APPROVAL REQUIRED', badge: 'VERIFYING' },
          { key: 'write', start: 4.42, label: '3 SCOPES APPROVED', badge: 'VERIFYING' },
          { key: 'retry', start: 9.26, label: 'NEW CLIENT · SAME PLAN', badge: 'VERIFYING' },
          { key: 'fresh', start: 13.84, label: 'REPLAYING FIXTURE GRAPH', badge: 'VERIFYING' },
          { key: 'closed', start: 19.1, label: 'CLOSED · FRESH EVIDENCE', badge: 'CLOSED' }
        ];
        const chipDriver = { t: 0 };
        let lastChipKey = '';
        const updateChipState = () => {
          const state = entryAt(CHIP_STATES, chipDriver.t);
          if (state.key !== lastChipKey) {
            topChipCopy.textContent = state.label;
            closedBadge.textContent = state.badge;
            lastChipKey = state.key;
          }
        };

        gsap.set('[id="f07-writeback-closure-retry-panel"]', { opacity: 0.18 });
        gsap.set('[id="f07-writeback-closure-close-panel"]', { opacity: 0.08 });
        gsap.set(zeroState, { opacity: 0, scale: 0.88 });
        gsap.set(freshTime, { opacity: 0.28 });
        gsap.set('[class~="f07-writeback-closure-consumer-dot"]', { opacity: 0, scale: 0.6 });
        gsap.set('[id="f07-writeback-closure-supporting"]', { opacity: 0.48 });
        gsap.set(routeFill, { width: 120 });
        tl.to(chipDriver, { t: 22, duration: 22, ease: 'none', onUpdate: updateChipState }, 0);

        tl.fromTo('[class~="f07-writeback-closure-topbar"]', { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
        tl.fromTo('[class~="f07-writeback-closure-route"]', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 0.16);
        tl.fromTo('[id="f07-writeback-closure-write-panel"]', { opacity: 0.34, y: 22 }, { opacity: 0.72, y: 0, duration: 0.8, ease: 'power3.out' }, 0.42);
        tl.fromTo('[id="f07-writeback-closure-supporting"]', { y: 20 }, { y: 0, duration: 0.8, ease: 'power3.out' }, 0.5);

        tl.to(cam, { scale: 1.24, x: 324, y: -108, duration: 1.35, ease: 'power4.inOut', onUpdate: applyCamera }, 4.0);
        tl.to('[id="f07-writeback-closure-write-panel"]', { opacity: 1, duration: 0.55, ease: 'power2.out' }, 4.15);
        tl.to(routeFill, { width: 1218, duration: 1.25, ease: 'power3.inOut' }, 4.1);
        tl.to(writeDriver, { t: writeTotal, duration: 3.25, ease: 'none', onUpdate: updateWriteSequence }, 5.18);
        tl.fromTo('[id="f07-writeback-closure-write-count"]', { scale: 0.82 }, { scale: 1, duration: 0.4, ease: 'back.out(1.5)' }, 8.25);

        tl.to(cam, { scale: 1.2, x: -430, y: -96, duration: 1.15, ease: 'power4.inOut', onUpdate: applyCamera }, 9.0);
        tl.to('[id="f07-writeback-closure-retry-panel"]', { opacity: 1, duration: 0.48, ease: 'power2.out' }, 9.2);
        tl.to('[id="f07-writeback-closure-write-panel"]', { opacity: 0.28, duration: 0.42, ease: 'power2.out' }, 9.2);
        tl.to(retryDriver, { t: retryTotal, duration: 3.0, ease: 'none', onUpdate: updateRetrySequence }, 9.75);
        tl.fromTo(retryCount, { opacity: 0.2, scale: 0.72 }, { opacity: 1, scale: 1, duration: 0.7, ease: 'back.out(1.4)' }, 10.0);
        tl.to(routeFill, { width: 1432, duration: 0.9, ease: 'power3.out' }, 12.55);

        tl.to(cam, { scale: 0.98, x: -150, y: -18, duration: 1.35, ease: 'power2.inOut', onUpdate: applyCamera }, 13.5);
        tl.to('[id="f07-writeback-closure-close-panel"]', { opacity: 1, duration: 0.8, ease: 'power3.out' }, 13.75);
        tl.to('[id="f07-writeback-closure-retry-panel"]', { opacity: 0.24, duration: 0.65, ease: 'power2.out' }, 13.75);
        tl.to(routeFill, { width: 1608, duration: 1.05, ease: 'power3.out' }, 13.72);
        tl.fromTo(freshTime, { opacity: 0.28, y: 12 }, { opacity: 1, y: 0, duration: 0.76, ease: 'power3.out' }, 14.55);
        tl.fromTo(consumerDots, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.34, stagger: 0.11, ease: 'back.out(1.6)' }, 15.15);
        tl.to(consumerDots, { opacity: 0, scale: 0, duration: 0.3, stagger: 0.14, ease: 'power3.in' }, 16.35);
        tl.fromTo(zeroState, { opacity: 0, scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.72, ease: 'back.out(1.5)' }, 17.34);

        tl.to(cam, { scale: 1.24, x: -714, y: 8, duration: 1.25, ease: 'power4.out', onUpdate: applyCamera }, 18.5);
        tl.to('[class~="f07-writeback-closure-surrounding"]', { opacity: 0.1, filter: 'blur(8px)', duration: 0.82, ease: 'power3.out' }, 18.5);
        tl.to('[id="f07-writeback-closure-close-panel"]', { borderColor: 'rgba(64, 224, 192, 0.7)', duration: 0.7, ease: 'power2.out' }, 18.62);
        tl.fromTo('[id="f07-writeback-closure-closed-badge"]', { scale: 0.72 }, { scale: 1, duration: 0.72, ease: 'back.out(1.7)' }, 19.12);
        tl.fromTo('[class~="f07-writeback-closure-final-rule"]', { scaleX: 0, transformOrigin: '0% 50%' }, { scaleX: 1, duration: 0.92, ease: 'power3.out' }, 19.48);
        tl.fromTo('[class~="f07-writeback-closure-final-meta"] span', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.22, ease: 'power3.out' }, 20.0);
        tl.to(cam, { scale: 1.27, x: -742, y: 12, duration: 1.25, ease: 'power2.out', onUpdate: applyCamera }, 20.55);
      })();
    </script>
  </div>
</template>
