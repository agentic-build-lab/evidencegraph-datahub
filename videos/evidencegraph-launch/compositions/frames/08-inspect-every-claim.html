  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="08-inspect-every-claim"]');
      const q = (selector) => root.querySelector(selector);
      const qa = (selector) => Array.from(root.querySelectorAll(selector));
      const lockupStage = q('[class~="f08-inspect-every-claim-lockup-stage"]');
      const lockup = q('[class~="f08-inspect-every-claim-lockup"]');
      const chainCards = qa('[class~="f08-inspect-every-claim-chain-card"]');
      const wordmark = q('[class~="f08-inspect-every-claim-wordmark"]');
      const subtitle = q('[class~="f08-inspect-every-claim-subtitle"]');
      const railsStage = q('[class~="f08-inspect-every-claim-rails-stage"]');
      const rails = qa('[class~="f08-inspect-every-claim-rail"]');
      const markers = qa('[class~="f08-inspect-every-claim-rail-marker"]');
      const texts = qa('[class~="f08-inspect-every-claim-text"]');
      const cursors = qa('[class~="f08-inspect-every-claim-cursor"]');
      const finalCard = q('[class~="f08-inspect-every-claim-final-card"]');
      const metrics = qa('[class~="f08-inspect-every-claim-metric"]');
      const urlCard = q('[class~="f08-inspect-every-claim-url-card"]');

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["08-inspect-every-claim"] = tl;

      gsap.set(railsStage, { opacity: 0 });
      gsap.set(finalCard, { opacity: 0 });

      tl.fromTo(chainCards, { opacity: 0, y: 22, scale: 0.98 }, { opacity: (index) => [0.26, 0.46, 0.7][index], y: 0, scale: 1, duration: 0.58, stagger: 0.13, ease: "power3.out" }, 0.0)
        .fromTo(lockup, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 0.18)
        .fromTo(wordmark, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.52, ease: "power2.out" }, 0.42)
        .fromTo(subtitle, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.48, ease: "power2.out" }, 0.78)
        .set(lockupStage, { opacity: 0 }, 3.0)
        .set(railsStage, { opacity: 1, scale: 1, filter: "blur(0px)" }, 3.0)
        .fromTo(rails[0], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 3.02)
        .fromTo(markers[0], { scaleY: 0 }, { scaleY: 1, duration: 0.34, ease: "power2.out" }, 3.04)
        .fromTo(rails[1], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 4.17)
        .fromTo(markers[1], { scaleY: 0 }, { scaleY: 1, duration: 0.34, ease: "power2.out" }, 4.19)
        .fromTo(rails[2], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 5.42)
        .fromTo(markers[2], { scaleY: 0 }, { scaleY: 1, duration: 0.34, ease: "power2.out" }, 5.44);

      const sequences = [
        [
          { t: 0.0, text: "" },
          { t: 0.12, text: "PUBLIC" },
          { t: 0.32, text: "PUBLIC REPLAY" },
          { t: 0.58, text: "evidencegraph-datahub" },
          { t: 0.88, text: "github.com/agentic-build-lab/evidencegraph-datahub" },
          { t: 1.08, text: "github.com/agentic-build-lab/evidencegraph-datahub  ✓" }
        ],
        [
          { t: 0.0, text: "" },
          { t: 1.18, text: "CLAIMS" },
          { t: 1.42, text: "EVIDENCE LEDGER" },
          { t: 1.72, text: "outputs/evidence-ledger.json" },
          { t: 2.08, text: "claim · source · confidence · test  ✓" }
        ],
        [
          { t: 0.0, text: "" },
          { t: 2.42, text: "SOURCE" },
          { t: 2.66, text: "OPEN-SOURCE REPOSITORY" },
          { t: 2.96, text: "github.com/agentic-build-lab" },
          { t: 3.32, text: "github.com/agentic-build-lab/evidencegraph-datahub  ✓" }
        ]
      ];

      const textAt = (sequence, time) => {
        for (let index = sequence.length - 1; index >= 0; index -= 1) {
          if (time >= sequence[index].t) return sequence[index].text;
        }
        return "";
      };

      const driver = { t: 0 };
      tl.to(driver, {
        t: 4,
        duration: 4,
        ease: "none",
        onUpdate: () => {
          texts.forEach((element, index) => {
            element.textContent = textAt(sequences[index], driver.t);
          });
        }
      }, 3.0);

      const blink = { p: 0 };
      tl.to(blink, {
        p: Math.PI * 12,
        duration: 4,
        ease: "none",
        onUpdate: () => {
          const active = driver.t < 1.18 ? 0 : driver.t < 2.42 ? 1 : driver.t < 3.72 ? 2 : -1;
          cursors.forEach((cursor, index) => {
            cursor.style.opacity = index === active && Math.sin(blink.p) > 0 ? "1" : "0";
          });
        }
      }, 3.0);

      tl.to(railsStage, { scale: 0.8, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 6.8)
        .to(railsStage, { opacity: 0.15, duration: 0.2, ease: "none" }, 6.8)
        .set(railsStage, { opacity: 0 }, 7.0)
        .fromTo(finalCard, { opacity: 0.15, scale: 1.25, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.52, ease: "expo.out" }, 7.0)
        .fromTo(metrics, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.42, stagger: 0.28, ease: "power2.out" }, 7.42)
        .fromTo(urlCard, { opacity: 0, y: 18, scale: 0.985 }, { opacity: 1, y: 0, scale: 1, duration: 0.72, ease: "power3.out" }, 8.55);
    })();
  </script>
