<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0C1B22;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="150"

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-change-not-incident", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 14);
        tl.fromTo("#el-02-repo-blind-spot", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 14);
        tl.to("#el-02-repo-blind-spot", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 34);
        tl.fromTo("#el-03-context-graph", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 34);
        tl.to("#el-03-context-graph", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 53);
        tl.fromTo("#el-04-complete-blast-radius", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 53);
        tl.to("#el-04-complete-blast-radius", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 74);
        tl.fromTo("#el-05-migration-bundle", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 74);
        tl.to("#el-05-migration-bundle", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 94);
        tl.fromTo("#el-06-evidence-gates", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 94);
        tl.to("#el-06-evidence-gates", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 116);
        tl.fromTo("#el-07-writeback-closure", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 116);
        tl.to("#el-07-writeback-closure", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 138);
        tl.fromTo("#el-08-inspect-every-claim", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 138);
        tl.to({}, { duration: 150 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
